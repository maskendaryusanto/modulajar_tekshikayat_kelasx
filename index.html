<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Media Belajar Teks Hikayat – SMAN 1 Pronojiwo</title>
<style>
:root{--g:#0b5d3b;--g2:#e3f1ea;--o:#e8710a;--bg:#f4f7f5;--t:#17261e;--c:#fff;--b:#d3e0d8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1913;--t:#e6efe9;--c:#17251d;--b:#2b4036;--g2:#1b2f25}}
:root[data-theme=dark]{--bg:#0f1913;--t:#e6efe9;--c:#17251d;--b:#2b4036;--g2:#1b2f25}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--t);line-height:1.6;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,select{-webkit-user-select:text;user-select:text}img{-webkit-user-drag:none;max-width:100%}
header{background:var(--g);color:#fff;padding:8px 12px;display:flex;align-items:center;gap:10px;border-bottom:4px solid var(--o)}
header img{height:46px}header h1{font-size:15px;margin:0;line-height:1.2;flex:1}header small{display:block;font-weight:400;opacity:.85}
.chip{font-size:11px;text-align:right}.chip button{margin-top:2px}
nav{display:flex;overflow-x:auto;background:var(--c);border-bottom:1px solid var(--b)}nav button{flex:0 0 auto;border:0;background:none;color:var(--t);padding:11px 13px;font-size:14px;font-weight:600;border-bottom:3px solid transparent;cursor:pointer}nav button.on{color:var(--o);border-color:var(--o)}
main{max-width:860px;margin:0 auto;padding:14px}h2{color:var(--g);margin:.2em 0 .5em}:root[data-theme=dark] h2{color:#7fd1a8}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;margin:12px 0}
.btn,button.s{background:var(--o);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer}.btn.g{background:var(--g)}.btn:disabled{opacity:.45}
button.s{padding:4px 10px;font-size:12px;background:#ffffff33}
.box{border-left:5px solid;border-radius:8px;padding:10px 12px;margin:10px 0}.ing{background:#e8710a1f;border-color:var(--o)}.con{background:#0b8a5a1f;border-color:#0b8a5a}.ana{background:#4a6fd01f;border-color:#4a6fd0}
.box b.l{display:block;font-size:12px;letter-spacing:.05em;text-transform:uppercase}
.tabs{display:flex;flex-wrap:wrap;gap:6px}.tabs button{border:1px solid var(--g);background:var(--c);color:var(--g);border-radius:20px;padding:6px 12px;font-weight:600;cursor:pointer}.tabs button.on{background:var(--g);color:#fff}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.flow span{background:var(--g2);border:1px solid var(--g);border-radius:20px;padding:5px 11px;font-size:13px;font-weight:600}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{border:1px solid var(--b);padding:6px;text-align:left;vertical-align:top}th{background:var(--g2)}.sc{overflow-x:auto}
.ins{font-size:12px;color:var(--o);font-weight:700;margin:2px 0 6px}.op{display:block;padding:7px 9px;border:1px solid var(--b);border-radius:8px;margin:5px 0;cursor:pointer}
.tfr{display:flex;gap:8px;justify-content:space-between;align-items:center;margin:6px 0;flex-wrap:wrap}.tfr span{flex:1 1 220px}
input[type=text],input[type=password],select{padding:9px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t);font-size:15px;max-width:100%}
.warn{background:#c62828;color:#fff;border-radius:8px;padding:8px 12px;font-size:13px;margin:8px 0}
.ok{color:#0b8a5a;font-weight:700}.no{color:#c62828;font-weight:700}.fb{margin-top:8px;font-size:14px}
.lv{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
#wm{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}#wm div{width:220%;margin:-40% 0 0 -60%;transform:rotate(-25deg);font-size:13px;font-weight:700;opacity:.09;line-height:2.6;word-spacing:14px}
.full{position:fixed;inset:0;z-index:99;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center}
.full .card{color:var(--t);max-width:380px;width:100%}.full img{height:90px;margin-bottom:6px}
#mdl{position:fixed;inset:0;background:#000a;z-index:90;display:none;align-items:center;justify-content:center;padding:18px}#mdl .card{max-width:420px;width:100%}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#c62828;color:#fff;padding:9px 14px;border-radius:8px;font-size:13px;z-index:95;display:none;max-width:90%}
</style></head><body>

"<p><b>Hikayat</b> adalah karya sastra Melayu lama berbentuk prosa yang menceritakan kehidupan raja, keluarga istana, dan pahlawan, sering disertai kejadian ajaib. Mulanya disampaikan secara lisan, kemudian ditulis tangan.</p>"+B("ing","Ingat – Ciri hikayat","<ol><li>Anonim (pengarang tidak diketahui)</li><li>Istanasentris: tokoh raja, putri, hulubalang</li><li>Ada kemustahilan (kesaktian, makhluk gaib)</li><li>Bahasa Melayu klasik: alkisah, syahdan, hatta</li><li>Bersifat didaktis (mengandung ajaran)</li></ol>")+B("con","Contoh","“Alkisah, maka tersebutlah perkataan seorang raja di negeri Indrapura bernama Sultan Mansur. Syahdan, baginda beroleh seorang putra yang rupanya elok lagi sakti.”")+B("ana","Analisis contoh","<i>Alkisah</i> = kata pembuka khas; <i>raja, baginda</i> = istanasentris; <i>sakti</i> = unsur kemustahilan. Contoh hikayat: Hikayat Hang Tuah, Bayan Budiman, Si Miskin, Indera Bangsawan.")],

beranda:()=>"<h2>Selamat Datang, "+U.n+"!</h2>"+'<div class="card"><h3>Gambaran Singkat</h3><p>Hikayat adalah prosa Melayu lama tentang raja, pahlawan, dan kejadian ajaib yang sarat nilai kehidupan. Di sini kamu akan menyimak, menganalisis, menulis, dan menampilkan hikayat dengan kreatif. Mata pelajaran Bahasa Indonesia, Kelas X (Fase E).</p></div><div class="card"><h3>Tujuan Pembelajaran</h3><ol><li>Menyimak hikayat yang dibacakan untuk memahami dan menganalisis pesan dalam teks narasi.</li><li>Membaca untuk menilai dan mengkritisi karakterisasi dan plot pada hikayat dan cerpen serta mengaitkannya dengan nilai kehidupan masa lalu dan sekarang.</li><li>Memahami kaidah kebahasaan dalam menulis teks hikayat dan cerpen.</li><li>Menulis gagasan, pandangan, atau pesan secara logis, kritis, dan reflektif dalam teks fiksi, serta mempublikasikannya di media cetak maupun digital.</li><li>Menyajikan teks narasi dalam bentuk monolog secara runut dan kreatif.</li></ol></div><div class="card"><h3>Peta Alur Belajar</h3><div class="flow"><span>Beranda</span>→<span>Materi</span>→<span>Ringkasan</span>→<span>Proyek</span>→<span>Kuis 5 Level</span>→<span>Latihan</span>→<span>Evaluasi</span>→<span>Rekap Nilai</span></div></div><button class="btn" onclick="go(\'materi\')">Mulai Belajar →</button>',
materi:()=>'<div class="tabs" id="tb"></div><div class="card" id="tc"></div>',
ringkas:()=>'<h2>Ringkasan Materi</h2><div class="card"><ul><li><b>Hikayat</b>: prosa Melayu lama, anonim, istanasentris, memuat kemustahilan, bersifat didaktis.</li><li><b>Struktur</b>: abstrak (opsional) → orientasi → komplikasi → evaluasi → resolusi → koda.</li><li><b>Unsur intrinsik</b>: tema, tokoh/penokohan (analitik/dramatik), alur, latar, sudut pandang, amanat.</li><li><b>Kaidah kebahasaan</b>: kata arkais (alkisah, syahdan, titah, patik), konjungsi penerus (maka, kemudian), kalimat panjang, kalimat langsung, verba material/verbal/mental.</li><li><b>Hikayat vs cerpen</b>: hikayat mustahil, istanasentris, bahasa klasik; cerpen realistis, singkat, bahasa modern.</li><li><b>Menilai</b>: bandingkan nilai masa lalu dan kini secara kritis.</li><li><b>Menulis & monolog</b>: rencanakan → tulis → sunting → publikasikan → tampilkan runtut dan ekspresif.</li></ul></div>',
proyek:()=>'<h2>Tugas Proyek: Hikayat Kreatifku</h2><div class="card"><p>Tulis hikayat orisinal bertema nilai kehidupan, publikasikan, lalu tampilkan sebagai monolog. <i>Centang langkah yang sudah kamu selesaikan.</i></p>'+ST.map((s,i)=>'<label class="op"><input type="checkbox" '+(D.pr[i]?"checked":"")+' onchange="pj('+i+',this.checked)"> <b>Langkah '+(i+1)+".</b> "+s+"</label>").join("")+'</div><div class="card"><h3>Rubrik Penilaian</h3><div class="sc"><table><tr><th>Aspek</th><th>4 (Sangat baik)</th><th>3 (Baik)</th><th>2 (Cukup)</th><th>1 (Kurang)</th></tr>'+RB.map(r=>"<tr>"+r.map(c=>"<td>"+c+"</td>").join("")+"</tr>").join("")+"</table></div><p>Nilai = (jumlah skor ÷ 20) × 100. Penilaian akhir oleh guru.</p></div>",
kuis:()=>{let h="<h2>Kuis 5 Tingkat</h2><p>Dari mudah hingga HOTS. Level berikutnya terbuka bila skor minimal 3 dari 5.</p>"+WARN;for(let l=1;l<=5;l++){const o=D.q[l]||{},lock=l>1&&!(D.q[l-1]&&D.q[l-1].pass);h+='<div class="card lv"><div><b>Level '+l+"</b> "+(["Mudah","Dasar","Menengah","Analisis","HOTS"][l-1])+"<br><small>"+(o.att?"Terbaik: "+o.best+"/5 "+(o.pass?"✔ Tuntas":"")+" · "+o.att+"x percobaan":lock?"🔒 Terkunci":"Belum dikerjakan")+'</small></div><button class="btn" '+(lock?"disabled":"")+' onclick="startQ('+l+')">'+(o.att?"Ulangi":"Mulai")+"</button></div>"}return h},
latihan:()=>'<h2>10 Soal Latihan</h2><p>Tekan “Cek Jawaban” pada tiap soal untuk melihat pembahasan.</p><div class="warn">Menyalin dan screenshot tidak diizinkan.</div>'+LT.map((q,i)=>rq(q,i).replace('<div class="fb"','<button class="btn g" style="margin-top:8px" onclick="chk('+i+')">Cek Jawaban</button><div class="fb"')).join(""),
evaluasi:()=>'<h2>Evaluasi</h2><div class="card"><p>10 soal (pilihan ganda, pilihan ganda kompleks, benar-salah, isian singkat, menjodohkan). Skor total 100, sebagian soal dapat bernilai parsial. Maksimal 3 kali percobaan.</p><p>Percobaan terpakai: <b>'+D.ev.att+"/3</b>"+(D.ev.best!=null?" · Nilai terbaik: <b>"+D.ev.best+"</b>":"")+"</p>"+WARN+'<button class="btn" '+(D.ev.att>=3?"disabled":"")+' onclick="startE()">'+(D.ev.att>=3?"Kesempatan Habis":"Mulai Evaluasi")+"</button></div>",
rekap:()=>{const done=ST.filter((s,i)=>D.pr[i]).length,lt=Object.values(D.lt).filter(x=>x).length;let r="";for(let l=1;l<=5;l++){const o=D.q[l];r+="<tr><td>Kuis Level "+l+"</td><td>"+(o?o.best+"/5":"–")+"</td><td>"+(o?(o.pass?"Tuntas":"Belum")+" · "+o.att+"x":"Belum dikerjakan")+"</td></tr>"}
return"<h2>Rekap Nilai Siswa</h2><div class='card'><b>"+U.n+"</b> · Kelas "+U.k+"<br><small>Nilai otomatis terkirim ke spreadsheet guru.</small></div><div class='card sc'><table><tr><th>Bagian</th><th>Nilai</th><th>Status</th></tr><tr><td>Proyek</td><td>"+done+"/6 langkah</td><td>"+(done==6?"Selesai":"Proses")+"</td></tr>"+r+"<tr><td>Latihan</td><td>"+lt+"/10 benar</td><td>Dicek "+Object.keys(D.lt).length+"/10</td></tr><tr><td>Evaluasi</td><td>"+(D.ev.best!=null?D.ev.best+"/100":"–")+"</td><td>Terakhir: "+(D.ev.last!=null?D.ev.last:"–")+" · "+D.ev.att+"/3 percobaan</td></tr></table></div><button class='btn' style='background:#c62828' onclick='resetP()'>Reset Progres Saya</button>"}};
loginUI();
</script></body></html>
